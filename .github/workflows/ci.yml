name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The Python OrcaSlicer ships with its plugin runtime
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install --quiet ruff

      - name: Lint and test
        run: make check RUFF=ruff PYTHON=python

      - name: Check whitespace
        run: git diff --check
